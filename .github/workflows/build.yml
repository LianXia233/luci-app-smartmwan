name: build

# 编译策略：**只有版本号变化才编译**（日常提交不触发）。
#   触发：Makefile 改动（版本号所在文件）/ tag / 手动 dispatch → gate job 精确比对
#          PKG_VERSION 与 PKG_RELEASE，未变化则全部 skip。
#
# 产物策略：只出 aarch64_cortex-a53 的 APK（mediatek/filogic、ipq807x 等主流 ARM64 路由）。
#   * Rust 用工具链交叉编译（rustup target + cargo-zigbuild，Zig 自带 musl 运行时），
#     **不**用 OpenWrt SDK 的 make package/compile —— 那会拉起整套构建系统
#     （feeds + 工具链 + 全包解析，单次 15 分钟起），而本包 Rust 侧只是一个
#     普通 musl 静态二进制，产物等价；
#   * APK 打包只借 SDK 里的 `apk mkpkg` 工具（不是编译器），文件树由
#     scripts/build-apk.sh 按 Makefile 的 install 段等价组装。

on:
  push:
    branches: [ main ]
    paths:
      - 'Makefile'
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TARGET: aarch64-unknown-linux-musl
  PKG_ARCH: aarch64_cortex-a53

jobs:
  gate:
    name: 版本门禁
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2        # 需要 HEAD^ 里的 Makefile 做比对

      - id: check
        name: 比对 PKG_VERSION / PKG_RELEASE
        run: |
          set -euo pipefail
          cur=$(sed -n 's/^PKG_VERSION:=//p' Makefile | tr -d '[:space:]')
          rel=$(sed -n 's/^PKG_RELEASE:=//p' Makefile | tr -d '[:space:]')
          now="${cur}-r${rel}"
          echo "version=${now}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "手动触发或 tag → 放行（${now}）"
            exit 0
          fi

          prev="-"
          if git rev-parse --verify --quiet 'HEAD^' >/dev/null; then
            pv=$(git show 'HEAD^:Makefile' | sed -n 's/^PKG_VERSION:=//p' | tr -d '[:space:]' || true)
            pr=$(git show 'HEAD^:Makefile' | sed -n 's/^PKG_RELEASE:=//p' | tr -d '[:space:]' || true)
            [ -n "$pv" ] && prev="${pv}-r${pr}"
          fi

          if [ "$prev" != "$now" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "版本变化 ${prev} → ${now} → 放行"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::版本未变化（${now}），本次不编译。发布请提升 PKG_VERSION 或打 tag。"
          fi

  frontend:
    name: 前端（语法 / 组件冒烟 / 零 Lua）
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 语法检查（node --check）
        run: |
          set -e
          shopt -s nullglob
          for f in htdocs/luci-static/resources/smw*.js \
                   htdocs/luci-static/resources/smartmwan.js \
                   htdocs/luci-static/resources/view/smartmwan/*.js \
                   scripts/*.js; do
            node --check "$f"
            echo "ok $f"
          done

      - name: 组件与视图冒烟（194 项）
        run: node scripts/ui-smoke.js

      - name: 零 Lua 扫描
        run: ./scripts/no-lua-check.sh --verbose

  rust-lint:
    name: Rust 静态检查（fmt / clippy / test）
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式
        run: cargo fmt --all --check

      - name: Clippy（警告即错误）
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: 单元与集成测试
        run: cargo test --locked

  apk:
    name: APK（aarch64_cortex-a53）
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_TARGET }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: 安装 Zig（提供 musl 交叉 C 运行时）
        run: |
          ZIG_VERSION=0.13.0
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-linux-x86_64-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          tar -xJf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-${ZIG_VERSION}" >> "$GITHUB_PATH"
          /tmp/zig-linux-x86_64-${ZIG_VERSION}/zig version

      - name: 交叉编译目标（${{ env.RUST_TARGET }}）
        run: |
          cargo zigbuild --release --locked --target "$RUST_TARGET"
          BIN="target/$RUST_TARGET/release/smartmwand"
          file "$BIN"
          # OpenWrt 是 musl 环境：有 NEEDED 说明链到了 glibc，装上去也跑不起来。
          if readelf -d "$BIN" | grep -q NEEDED; then
            echo "::error::产物存在动态依赖，OpenWrt 上无法运行"
            readelf -d "$BIN"
            exit 1
          fi
          echo "已确认静态链接（无 NEEDED 条目）"

      - name: 本机编译（仅用于生成默认配置与 nft 片段）
        run: |
          # --dump-defaults / --dump-include 输出纯文本，与架构无关；
          # 交叉产物在 x86 runner 上跑不了，所以用一份本机二进制来生成。
          cargo build --release --locked
          ./target/release/smartmwand --help 2>&1 | head -5 || true

      - name: 取 OpenWrt SDK 的 apk 打包工具
        run: |
          set -euo pipefail
          # 注意：SDK 里的 `apk` 是一个包装脚本，靠同级的 ../lib/ld-linux 起自己的
          # 动态加载器（`${0%/*}/../lib/ld-linux-*.so.2 --library-path ...`）。
          # 只复制 apk 这一个文件会得到 "No such file or directory"（退出码 127），
          # 所以这里保留整个 SDK 目录，不做单文件缓存。
          BASE="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/"
          SDK=$(curl -fsSL "$BASE" | grep -oE 'openwrt-sdk-[^"]*Linux-x86_64\.tar\.zst' | head -1)
          [ -n "$SDK" ] || { echo "::error::目录里没找到 SDK 文件名"; curl -fsSL "$BASE" | head -40; exit 1; }
          echo "SDK 文件：$SDK"

          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd fakeroot
          curl -fsSL "$BASE$SDK" -o /tmp/sdk.tar.zst
          mkdir -p /tmp/sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C /tmp/sdk --strip-components=1

          APK_TOOL=$(find /tmp/sdk/staging_dir/host/bin -maxdepth 1 -name apk -type f | head -1)
          [ -n "$APK_TOOL" ] || { echo "::error::SDK 里没有 apk 工具"; ls -la /tmp/sdk/staging_dir/host/bin | head -30; exit 1; }
          echo "APK_TOOL=$APK_TOOL" >> "$GITHUB_ENV"
          "$APK_TOOL" --version

      - name: 打包 APK
        run: |
          # fakeroot：让包内文件属主记录为 root:root（否则是 runner，装到路由器上 uid 是 1001）
          command -v fakeroot >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq fakeroot
          }
          fakeroot -- true && echo "fakeroot 可用"
          chmod +x scripts/build-apk.sh
          APK_TOOL="$APK_TOOL" scripts/build-apk.sh \
            "target/$RUST_TARGET/release/smartmwand" \
            "target/release/smartmwand" \
            dist "$PKG_ARCH"
          ls -la dist/

      - name: 校验 APK 内容
        run: |
          set -euo pipefail
          PKG=$(ls dist/*.apk | head -1)
          echo "--- 头部魔数（APKv3 是 ADB 格式，不是 gzip tar，所以不能用 tar 解）---"
          head -c 12 "$PKG" | od -An -c

          echo "--- adbdump 摘要（前 30 行）---"
          "$APK_TOOL" adbdump "$PKG" | head -30

          echo "--- 文件清单 ---"
          # 未签名包：优先带 --allow-untrusted，个别版本不支持就退回不带参数的调用。
          MANIFEST=$("$APK_TOOL" manifest --allow-untrusted "$PKG" 2>/dev/null \
                     || "$APK_TOOL" manifest "$PKG" \
                     || "$APK_TOOL" adbdump "$PKG")
          echo "$MANIFEST" | head -25

          echo "--- 关键文件必须存在 ---"
          for f in smartmwand smartmwan.js smwcore.js smwform.js smartmwan.uc smartmwan.nft smartmwan.css; do
            if ! echo "$MANIFEST" | grep -q "$f"; then
              echo "::error::包内缺少 $f"
              exit 1
            fi
            echo "  ok $f"
          done
          echo "共 $(echo "$MANIFEST" | wc -l) 行清单"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-smartmwan-${{ needs.gate.outputs.version }}-${{ env.PKG_ARCH }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
